<header><h2>斗鸡 Excel 配表</h2><p>保存 Excel → 校验预览 → 导出并刷新资源</p></header>
<section class="source">
  <label for="source">配置文件</label>
  <div class="file-row"><input id="source" readonly /><button id="choose">选择文件…</button><button id="open">打开 Excel</button></div>
  <div class="output">输出到 <span id="destination"></span></div>
</section>
<div class="actions"><button id="inspect">校验预览</button><button id="export" class="primary">导出并刷新资源</button><span>导出会重新读取已保存的文件</span></div>
<pre id="status" role="status" aria-live="polite">正在读取工作簿…</pre>
<div class="preview-tools"><label for="sheets">工作表</label><select id="sheets" disabled></select><span id="count"></span></div>
<div class="table-wrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table><div id="empty">校验后显示数据预览</div></div>
<footer>Enemy 的「目标战斗时长」可逐怪配置。前五行表头不要修改；文本中的 {0}、{1} 等占位符需要保留。</footer>
